<style>

ta:{code:'ta-IN',hero:'அவளுக்கு என்ன தேடுவது என்று தெரியாது.\nதெரிய வேண்டியதில்லை.\nஅவள் பேசினால் போதும்.',ask:'உங்களுக்கு என்ன உதவி வேண்டும்?',speak:'பேச தொடங்குங்கள்',stop:'நிறுத்து',type:'எழுதி சொல்லுங்கள்',ph:'இங்கே எழுதுங்கள்…',send:'அனுப்பு',demo:'டெமோ பாருங்கள்',d60:'60 விநாடி டெமோ',listen:'நான் கேட்கிறேன்…',nosr:'இந்த உலாவியில் குரல் கேட்கும் வசதி இல்லை. தயவுசெய்து எழுதி சொல்லுங்கள்.',deny:'மைக் அனுமதி கிடைக்கவில்லை. எழுதி சொல்லுங்கள்.',noheard:'எதுவும் கேட்கவில்லை. மீண்டும் முயற்சிக்கவும் அல்லது எழுதுங்கள்.',idk:'எனக்குத் தெரியாது',restart:'மீண்டும் தொடங்கு',read:'படித்துக் காட்டு',

share:'WhatsApp-ல் அனுப்பு',other:'வேறு உதவி காட்டு',inP:'நேரில் உதவி வேண்டுமா?',csc:'அருகிலுள்ள பொது சேவை மையம் (CSC)',call:'பெண்கள் உதவி எண் 181 அழைக்க',allR:'எல்லாம் தயார்!',spk:'பேசுகிறேன்…',topics:[['💼','எனக்கு வேலை வேண்டும்','வேலை'],['🏪','எனக்கு தொழில் கடன் வேண்டும்','தொழில்'],['💻','நான் கணினி கற்க வேண்டும்','கணினி'],['🏛️','மாத உதவித்தொகை பற்றி தெரிய வேண்டும்','உதவித்தொகை']],gBtn:'படிப்படியாக வழிகாட்டு',gBack:'பின்',gRep:'மீண்டும்',gNext:'அடுத்து',gFin:'முடிந்தது',gDone:'மிகவும் நல்லது! நீங்கள் எல்லா படிகளையும் பார்த்துவிட்டீர்கள். தேவைப்பட்டால் மீண்டும் கேளுங்கள்.',
stepD:['உங்கள் ஆவணங்களை ஒரே இடத்தில் எடுத்து வையுங்கள். பட்டியலில் தொட்டு தயார் என்று குறியுங்கள்.','"அதிகாரப்பூர்வ தளத்திற்கு செல்ல" பொத்தானைத் தொடுங்கள். புதிய பக்கம் திறக்கும்.','அந்தப் பக்கத்தில் பெயர், மொபைல் எண் போன்ற விவரங்களை நிரப்புங்கள். புரியாவிட்டால் இங்கே திரும்பி வந்து கேளுங்கள்.','எல்லாம் சரியா என்று பார்த்து சமர்ப்பியுங்கள். கிடைக்கும் ரசீது அல்லது எண்ணை போட்டோ எடுத்து வையுங்கள்.'],

stuck:[['என்னிடம் ஒரு ஆவணம் இல்லை','பரவாயில்லை. எந்த ஆவணம் இல்லை என்பதை அதிகாரப்பூர்வ அலுவலகத்திலோ பொது சேவை மையத்திலோ சொல்லுங்கள். அதை எப்படி பெறுவது என்று அவர்கள் சொல்வார்கள்.'],['என்னிடம் ஸ்மார்ட்போன் / இணையம் இல்லை','கவலை வேண்டாம். பொது சேவை மையத்தில் நேரில் சென்று விண்ணப்பிக்க உதவி கேட்கலாம். கீழே நேரில் உதவி பகுதியைப் பாருங்கள்.'],['இது இலவசமா?','என்னால் உறுதியாகச் சொல்ல முடியாது. அதிகாரப்பூர்வ தளத்தில் சரிபார்க்கவும். பணம் கேட்பவர்களிடம் கவனமாக இருங்கள்.']],howto:'பெரிய மைக் பொத்தானைத் தொட்டு, உங்களுக்கு என்ன உதவி வேண்டும் என்று உங்கள் மொழியில் சொல்லுங்கள். எழுத வேண்டியதில்லை.',hear:'எப்படி பயன்படுத்துவது? கேளுங்கள்',print:'பட்டியலை அச்சிடு',fb:'இது உதவியாக இருந்ததா?',fbT:'நன்றி! உங்கள் கருத்து எங்களுக்கு உதவும்.',tnN:'இது தமிழ்நாடு அரசின் தளம். நீங்கள் வசிக்கும் இடத்திற்குப் பொருந்துமா என்று சரிபார்க்கவும்.',demoB:'டெமோ: லட்சுமி, 32 வயது, சென்னை',trust:'penmAI சேவைகளைப் புரிந்துகொள்ளவும் அணுகவும் உதவுகிறது. அரசு முடிவுகளை எடுப்பதில்லை. இறுதித் தகுதியை அதிகாரப்பூர்வ தளத்தில் சரிபார்க்கவும்.',priv:'உங்கள் உரையாடல் இந்த டெமோவில் வழிகாட்ட மட்டுமே பயன்படுகிறது. கடவுச்சொல், OTP, வங்கி PIN போன்றவற்றை உள்ளிட வேண்டாம். எதுவும் சேமிக்கப்படுவதில்லை.',

async function ai(txt){const k=window.PENMAI_GEMINI_KEY;if(!k)return null;try{const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+k,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:'Classify into one of mudra,dig,tn,edu,job or none. Reply with the one word only: '+txt}]}]})});const j=await r.json();const w=j.candidates[0].content.parts[0].text.trim().toLowerCase();return ['mudra','dig','tn','edu','job'].includes(w)?w:null}catch(e){return null}}

 if(S.q==='age'){const m=txt.match(/\d{1,3}/);if(!m){S.busy=false;return push('ai',t().badAge)}S.prof.age=+m[0]}
 else if(S.q==='dist'){S.prof.dist=txt}
 else if(S.q==='work'){S.prof.work=/^(no|இல்லை|illai|नहीं|nahi|n)/i.test(txt)?'no':'yes'}
 S.busy=false;ask()}
